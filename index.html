<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/firacode/6.2.0/fira_code.min.css" />
    <link data-trunk rel="rust" />
    <title>Kyle Stiers Resume</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at top, #1f2937 0%, #0b1220 55%, #05080f 100%);
      }

      body {
        font-family: "Fira Code", monospace;
      }

      pre {
        margin: 0;
      }

      /* Remove focus ring on the terminal grid */
      #grid {
        outline: none;
      }
    </style>
    <script>
      window.addEventListener('TrunkApplicationStarted', () => {
        // Wait for two animation frames so draw_web's first render
        // has time to append the grid to the DOM before we focus it.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            const grid = document.getElementById('grid');
            if (grid) grid.focus();
          });
        });
      });
    </script>
  </head>
  <body></body>
</html>
