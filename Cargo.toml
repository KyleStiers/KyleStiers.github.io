[package]
name = "kyle_resume_tui"
version = "0.1.0"
edition = "2024"

[dependencies]
ratzilla = "0.3.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
critical-section = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
